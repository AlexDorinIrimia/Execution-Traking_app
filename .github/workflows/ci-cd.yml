name: CI/CD – Build, Test & Deploy

# ── Triggers ──────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# ── Shared env ────────────────────────────────────────────────────────────────
env:
  AWS_REGION:    eu-central-1
  ECR_REPO:      execution-api
  EKS_CLUSTER:   execution-eks
  K8S_NAMESPACE: default

# ══════════════════════════════════════════════════════════════════════════════
jobs:

  # ── 1. Unit tests (no DB needed) ──────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ingestion-api/app/requirements.txt

      - name: Install dependencies
        run: pip install -r ingestion-api/app/requirements.txt

      - name: Run pytest
        run: pytest ingestion-api/tests/tests.py -v --tb=short
        env:
          APP_ENV:     test
          APP_VERSION: 0.0.0-ci
          DB_HOST:     localhost
          DB_NAME:     execution_db
          DB_USER:     user_exec
          DB_PASSWORD: password
          DB_SSLMODE:  disable

  # ── 2. Build & push Docker image to ECR ───────────────────────────────────
  build-and-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    needs: test
    # Only run on pushes to main (not PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    outputs:
      image_uri: ${{ steps.image.outputs.uri }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        id: image
        env:
          REGISTRY:   ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG:  ${{ github.sha }}
        run: |
          IMAGE_URI="$REGISTRY/$ECR_REPO:$IMAGE_TAG"
          docker build -t "$IMAGE_URI" ingestion-api/
          # Also tag as latest for convenience
          docker tag "$IMAGE_URI" "$REGISTRY/$ECR_REPO:latest"
          docker push "$IMAGE_URI"
          docker push "$REGISTRY/$ECR_REPO:latest"
          echo "uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

  # ── 3. Deploy to EKS ──────────────────────────────────────────────────────
  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER" \
            --region "$AWS_REGION"

      - name: Apply ConfigMap & Service (idempotent)
        run: |
          kubectl apply -f k8s/cloud/configmap.yaml -n "$K8S_NAMESPACE"
          kubectl apply -f k8s/cloud/service.yaml   -n "$K8S_NAMESPACE"

      - name: Deploy new image
        env:
          IMAGE_URI: ${{ needs.build-and-push.outputs.image_uri }}
        run: |
          # Patch the deployment image directly — avoids committing a
          # generated YAML with the SHA baked in.
          kubectl set image deployment/execution-api \
            execution-api="$IMAGE_URI" \
            -n "$K8S_NAMESPACE"

          # Wait for rollout to complete (timeout = 5 min)
          kubectl rollout status deployment/execution-api \
            -n "$K8S_NAMESPACE" \
            --timeout=300s

      - name: Smoke test /health
        run: |
          LB_HOST=$(kubectl get svc execution-api-service \
            -n "$K8S_NAMESPACE" \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          echo "Load balancer: $LB_HOST"
          # Retry for up to 60 s while the LB warms up
          for i in $(seq 1 12); do
            STATUS=$(curl -sf "http://$LB_HOST/health" | python3 -c "import sys,json; print(json.load(sys.stdin).get('status',''))" 2>/dev/null || true)
            if [ "$STATUS" = "healthy" ]; then
              echo "✅ /health returned healthy"
              exit 0
            fi
            echo "Attempt $i/12 – waiting…"
            sleep 5
          done
          echo "❌ Smoke test failed after 60 s"
          exit 1
