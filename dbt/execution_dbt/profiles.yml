execution_dbt:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DB_HOST') }}"
      user: "{{ env_var('DB_USER') }}"
      password: "{{ env_var('DB_PASSWORD') }}"
      port: "{{ env_var('DB_PORT') | int }}"
      dbname: "{{ env_var('DB_NAME') }}"
      schema: analytics
      threads: 4
      # FIX: was hardcoded to 'require' which breaks local docker Postgres.
      # Set DB_SSLMODE=disable in .env for local, require for RDS.
      sslmode: "{{ env_var('DB_SSLMODE', 'prefer') }}"
