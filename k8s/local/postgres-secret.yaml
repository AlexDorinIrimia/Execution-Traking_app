# k8s/cloud/secret.yaml
#
# Phase 6 – Kubernetes Secrets best practice
#
# ⚠️  NEVER commit real credentials in stringData / data fields.
#     The values below are placeholders.
#
# Recommended approaches (pick one):
#
#  A) AWS Secrets Manager + External Secrets Operator (recommended for EKS)
#     Install:  helm repo add external-secrets https://charts.external-secrets.io
#               helm install external-secrets external-secrets/external-secrets -n external-secrets --create-namespace
#     Then use an ExternalSecret manifest (see external-secret.yaml example below).
#
#  B) Sealed Secrets (kubeseal)
#     Install:  kubectl apply -f https://github.com/bitnami-labs/sealed-secrets/releases/latest/download/controller.yaml
#     Seal:     echo -n 'my-real-password' | kubectl create secret generic execution-api-secrets \
#                 --dry-run=client --from-literal=DB_PASSWORD=- -o yaml \
#               | kubeseal -o yaml > k8s/cloud/secret.yaml
#
#  C) For local / dev only — store secrets in a .env file, never commit it.
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: v1
kind: Secret
metadata:
  name: execution-api-secrets
type: Opaque
# FIX: original had plain-text credentials committed to source control.
#      Replace these placeholders with your sealed / externally-managed values.
stringData:
  DB_USER:     REPLACE_WITH_SEALED_OR_EXTERNAL_VALUE
  DB_PASSWORD: REPLACE_WITH_SEALED_OR_EXTERNAL_VALUE

---
