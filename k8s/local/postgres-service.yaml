apiVersion: v1
kind: Service
metadata:
  name: execution-api-service
  labels:
    # FIX (monitoring): added label so the Prometheus ServiceMonitor selector
    # can find this service by app=execution-api
    app: execution-api
spec:
  type: LoadBalancer
  selector:
    app: execution-api
  ports:
    - name: http          # FIX (monitoring): named port required by ServiceMonitor
      port: 80
      targetPort: 8000
